<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" th:href="@{/style.css}">
  <title>Reservation</title>
</head>

<body>
<div class="container">

<h1>Reservation</h1>

<p>
  Datum:
  <span th:text="${reservation.datum}"></span>
</p>

<p>
  Von:
  <span th:text="${reservation.von}"></span>
</p>

<p>
  Bis:
  <span th:text="${reservation.bis}"></span>
</p>

<p>
  Zimmer:
  <span th:text="${reservation.zimmer}"></span>
</p>

<p>
  Bemerkung:
  <span th:text="${reservation.bemerkung}"></span>
</p>

<h2>Teilnehmer</h2>

<ul>
  <li th:each="user : ${reservation.users}">
    <span th:text="${user.vorname}"></span>
    <span th:text="${user.nachname}"></span>
  </li>
</ul>



<br>

<a href="/">Zurück zur Startseite</a>
</div>
</body>
</html>
