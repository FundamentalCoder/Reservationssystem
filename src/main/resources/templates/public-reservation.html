<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" th:href="@{/style.css}">
  <title>Reservation</title>
</head>

<body>
<div class="container">

<h1>Reservation</h1>

<p>
  Datum:
  <span th:text="${reservation.datum}"></span>
</p>

<p>
  Von:
  <span th:text="${reservation.von}"></span>
</p>

<p>
  Bis:
  <span th:text="${reservation.bis}"></span>
</p>

<p>
  Zimmer:
  <span th:text="${reservation.zimmer}"></span>
</p>

<p>
  Bemerkung:
  <span th:text="${reservation.bemerkung}"></span>
</p>

<h2>Teilnehmer</h2>

<ul>
  <li th:each="user : ${reservation.users}">
    <span th:text="${user.vorname}"></span>
    <span th:text="${user.nachname}"></span>
  </li>
</ul>

<h2>Als Teilnehmer eintragen</h2>

<form th:action="@{/public/teilnehmen}" method="post">

  <input
          type="hidden"
          name="code"
          th:value="${reservation.publicCode}"
  >

  <label for="vorname">Vorname:</label>
  <input
          type="text"
          id="vorname"
          name="vorname"
          required
  >

  <br><br>

  <label for="nachname">Nachname:</label>
  <input
          type="text"
          id="nachname"
          name="nachname"
          required
  >

  <br><br>

  <button type="submit">
    Teilnehmen
  </button>

</form>

<br>

<a href="/">Zurück zur Startseite</a>
</div>
</body>
</html>
