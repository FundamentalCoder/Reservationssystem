<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Reservation bearbeiten</title>
</head>

<body>

<h1>Reservation bearbeiten</h1>

<p>
    Datum:
    <span th:text="${reservation.datum}"></span>
</p>

<p>
    Von:
    <span th:text="${reservation.von}"></span>
</p>

<p>
    Bis:
    <span th:text="${reservation.bis}"></span>
</p>

<p>
    Zimmer:
    <span th:text="${reservation.zimmer}"></span>
</p>

<p>
    Bemerkung:
    <span th:text="${reservation.bemerkung}"></span>
</p>

<a th:href="@{/private/bearbeiten(code=${reservation.privateCode})}">
    Reservation bearbeiten
</a>

<br><br>

<form th:action="@{/private/loeschen}" method="post">

    <input
            type="hidden"
            name="code"
            th:value="${reservation.privateCode}"
    >

    <button type="submit">
        Reservation löschen
    </button>

</form>

</body>
</html>
