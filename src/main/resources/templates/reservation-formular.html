<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Reservation erfassen</title>
</head>

<body>
 <div class="container">
<h1>Reservation erfassen</h1>

<form th:action="@{/reservation}"
      th:object="${reservation}"
      method="post">

    <label for="datum">Datum:</label>
    <input
            type="date"
            id="datum"
            th:field="*{datum}"
            required
    >

    <br><br>

    <label for="von">Von:</label>
    <input
            type="time"
            id="von"
            th:field="*{von}"
            required
    >

    <br><br>

    <label for="bis">Bis:</label>
    <input
            type="time"
            id="bis"
            th:field="*{bis}"
            required
    >

    <br><br>

    <label for="zimmer">Zimmer:</label>
    <select
            id="zimmer"
            th:field="*{zimmer}"
            required>

        <option value="">Bitte wählen</option>
        <option value="101">101</option>
        <option value="102">102</option>
        <option value="103">103</option>
        <option value="104">104</option>
        <option value="105">105</option>

    </select>

    <br><br>

    <label for="bemerkung">Bemerkung:</label>

    <textarea
            id="bemerkung"
            th:field="*{bemerkung}"
            minlength="10"
            maxlength="200"
            required>
    </textarea>

    <br><br><label for="users">Teilnehmer:</label>

    <input
            type="text"
            id="users"
            name="usersText"
            placeholder="Max Muster, Anna Keller"
            required
    >

    <br><br>


    <p th:if="${fehler}" th:text="${fehler}"></p>

    <button type="submit">
        Reservation erstellen
    </button>

</form>

<br>

<a href="/">
    Zurück zur Startseite
</a>
 </div>
</body>

</html>
